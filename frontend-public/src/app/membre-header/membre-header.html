<header class="header">
  <div class="header__title">
    <h1>{{ pageTitle }}</h1>
  </div>

  <div class="header__actions">

    
    <div class="header__notif-wrapper">
      <button class="header__notif" (click)="toggleNotifications()">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="header__badge" *ngIf="notifCount > 0">{{ notifCount }}</span>
      </button>

     
      <div class="header__notif-panel" *ngIf="showNotifPanel">
        <div class="notif-panel__head">
          <span class="notif-panel__title">Notifications</span>
          <button class="notif-panel__markall" (click)="toutMarquerLues()">
            Tout marquer comme lu
          </button>
        </div>

        <div class="notif-panel__empty" *ngIf="notifications.length === 0">
          Aucune notification
        </div>

        <ul class="notif-panel__list">
          <li
            *ngFor="let n of notifications"
            class="notif-panel__item"
            [class.notif-panel__item--unread]="!n.lu"
            (click)="marquerLue(n)">
            <span class="notif-panel__icon">{{ getIcon(n.type) }}</span>
            <div class="notif-panel__body">
              <p class="notif-panel__msg">{{ n.message }}</p>
             <span class="notif-panel__date">{{ getTemps(n.dateCreation) }}</span>
            </div>
            <span class="notif-panel__dot" *ngIf="!n.lu"></span>
          </li>
        </ul>
      </div>
    </div>

  </div>
</header>

<div class="header__overlay" *ngIf="showUserMenu || showNotifPanel" (click)="closeMenus()"></div>

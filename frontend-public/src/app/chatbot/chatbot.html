
<button
  class="chat-fab"
  type="button"
  aria-label="Ouvrir l'assistant ATIA"
  (click)="chatOpen = !chatOpen"
>
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
  </svg>
</button>


<div *ngIf="chatOpen" class="chat-window" role="dialog" aria-label="ATIA Assistant">

 
  <div class="chat-header">
    <div class="chat-header-avatar">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
    </div>
    <div class="chat-header-info">
      <p class="chat-header-name">ATIA Assistant</p>
      <p class="chat-header-status">
        <span class="chat-status-dot"></span>En ligne
      </p>
    </div>
    <button class="chat-close" type="button" aria-label="Fermer" (click)="chatOpen = false">✕</button>
  </div>


  <div class="chat-messages" #scrollContainer>

    <div class="chat-messages-spacer"></div>

    <div *ngFor="let msg of messages">
      <div class="chat-msg" [class.chat-msg--bot]="msg.role === 'bot'" [class.chat-msg--user]="msg.role === 'user'">

      
        <div *ngIf="msg.role === 'bot'" class="chat-msg-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
        </div>

        
        <p class="chat-bubble"
           [class.chat-bubble--bot]="msg.role === 'bot'"
           [class.chat-bubble--user]="msg.role === 'user'">
          {{ msg.content }}
        </p>

      </div>
    </div>

  
    <div *ngIf="isLoading" class="chat-msg chat-msg--bot">
      <div class="chat-msg-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
      </div>
      <p class="chat-bubble chat-bubble--bot typing-indicator">
        <span></span><span></span><span></span>
      </p>
    </div>

  </div>

  <div class="chat-input-row">
    <input
      class="chat-input"
      type="text"
      placeholder="Écrivez votre message…"
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      [disabled]="isLoading"
    />
    <button
      class="chat-send"
      type="button"
      aria-label="Envoyer"
      (click)="sendMessage()"
      [disabled]="isLoading"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
      </svg>
    </button>
  </div>

</div>

<div class="page">
  <div class="glow glow--left" aria-hidden="true"></div>
  <div class="glow glow--right" aria-hidden="true"></div>

  <a routerLink="/" class="back-link" aria-label="Retour à l'accueil">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Accueil
  </a>

  <div class="card">
    <div class="card-logo">
      <img src="assets/images/logo_atia.png" alt="ATIA" width="64" height="64" />
    </div>

    <h1 class="card-title">Espace Membre</h1>
    <p class="card-subtitle">Connectez-vous à votre espace</p>

    <div class="form" [formGroup]="loginForm">

      <div class="field">
        <label class="field-label" for="email">Email</label>
        <div class="field-input-wrap" [class.field-input-wrap--error]="email?.invalid && email?.touched">
  <span class="field-icon" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="20" height="16" x="2" y="4" rx="2"/>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
    </svg>
  </span>
  <input
    class="field-input"
    id="email"
    type="email"
    formControlName="email"
    placeholder="votre@email.com"
    autocomplete="email"
  />
</div>
<small class="field-error" *ngIf="email?.invalid && email?.touched">
  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 8v4m0 4h.01"/>
  </svg>
  Email invalide
</small>
      </div>

      <div class="field">
        <label class="field-label" for="password">Mot de passe</label>
      <div class="field-input-wrap" [class.field-input-wrap--error]="mp?.invalid && mp?.touched">
  <span class="field-icon" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </span>
  <input
    class="field-input field-input--password"
    id="password"
    [type]="showPassword ? 'text' : 'password'"
    formControlName="password"
    placeholder="••••••"
    autocomplete="current-password"
  />
  <button class="field-eye" type="button"
    aria-label="Afficher le mot de passe"
    (click)="togglePassword()">
    <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
      viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
      viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
  </button>
</div>
<small class="field-error" *ngIf="mp?.invalid && mp?.touched">
  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 8v4m0 4h.01"/>
  </svg>
  Mot de passe requis
</small>
      </div>

      

      <button class="btn-submit" type="button" (click)="login()">
        Se connecter →
      </button>

      <p class="forgot-line">
        <a routerLink="/mot-de-passe-oublie" class="forgot-link">Mot de passe oublié ?</a>
      </p>

      <p class="register-line">
        Pas encore membre ?
        <a routerLink="/demande-adhesion" class="register-link">Rejoindre l'ATIA</a>
      </p>

    
    </div>
  </div>
</div>

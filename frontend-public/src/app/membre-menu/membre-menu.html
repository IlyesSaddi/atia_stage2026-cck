
<button class="sidebar__toggle" (click)="toggleSidebar()">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
    fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="6" x2="21" y2="6"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>


<div
  class="sidebar__overlay"
  [class.visible]="isOpen"
  (click)="closeSidebar()">
</div>


<aside class="sidebar" [class.open]="isOpen">


  <div class="sidebar__logo">
    <img src="assets/images/logo_atia.png" alt="ATIA Logo" class="sidebar__logo-img" />
  </div>

  
  <nav class="sidebar__nav">
    <ul class="sidebar__menu">

      <li class="sidebar__item">
        <a
          routerLink="/tableau-de-bord"
          routerLinkActive="sidebar__link--active"
          class="sidebar__link"
          (click)="closeSidebar()">
          <span class="sidebar__icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
          </span>
          <span class="sidebar__label">Tableau de bord</span>
        </a>
      </li>

      <li class="sidebar__item">
        <a
          routerLink="/profil"
          routerLinkActive="sidebar__link--active"
          class="sidebar__link"
          (click)="closeSidebar()">
          <span class="sidebar__icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </span>
          <span class="sidebar__label">Mon Profil</span>
        </a>
      </li>

      <li class="sidebar__item">
        <a
          routerLink="/evenements"
          routerLinkActive="sidebar__link--active"
          class="sidebar__link"
          (click)="closeSidebar()">
          <span class="sidebar__icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>
          <span class="sidebar__label">Événements</span>
        </a>
      </li>

      <li class="sidebar__item">
        <a
          routerLink="/mes-avis"
          routerLinkActive="sidebar__link--active"
          class="sidebar__link"
          (click)="closeSidebar()">
          <span class="sidebar__icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
          </span>
          <span class="sidebar__label">Mes avis</span>
        </a>
      </li>



    </ul>
  </nav>

  
  <div class="sidebar__footer">
    <a class="sidebar__link sidebar__link--logout" (click)="onLogout()">
      <span class="sidebar__icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      <span class="sidebar__label">Déconnexion</span>
    </a>
  </div>

</aside>

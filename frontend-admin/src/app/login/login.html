<div class="login-container">
    <div class="login-wrapper">
      
      <div class="login-header">
        <img src="assets/images/atia_logo.png" alt="ATIA Logo" class="login-logo" />
        <p class="login-subtitle">Connectez-vous à votre tableau de bord</p>
      </div>
  
     
      <div class="login-card">
        <form  class="login-form" [formGroup]="loginForm" (ngSubmit)="login()">
          
          <div class="form-group">
            <label for="email" class="form-label">Adresse e-mail</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input
                id="email"
                type="email"
                class="form-input"
                placeholder="nom@exemple.com"
                 formControlName="email" 
                name="email"
                required
              />
            </div>
          </div>
  
        
          <div class="form-group">
            <div class="label-row">
              <label for="password" class="form-label">Mot de passe</label>
              <a href="#" class="forgot-link">Mot de passe oublié ?</a>
            </div>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input
                id="password"
                type="password"
                class="form-input has-toggle"
                placeholder="••••••••"
                formControlName="password"
                name="password"
                required
              />
             
            </div>
          </div>
  
     
          <button type="submit" class="btn-login">Se connecter</button>
        </form>
      </div>
  
      <p class="login-footer">&copy; 2025 ATIA. Tous droits réservés.</p>
    </div>
  </div>
